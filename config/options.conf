# CORS for /data/: the app reads a node's files cross-origin with credentials (a
# gpx track is fetched, not only displayed), the data cookie riding along. No
# request header is allowed beyond the safelisted ones: X-Session-Token belongs
# to /service/, which no browser calls.
add_header Access-Control-Allow-Origin "https://application.localhost:8443" always;
add_header Access-Control-Allow-Credentials "true" always;

if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin "https://application.localhost:8443";
    add_header Access-Control-Allow-Credentials "true";
    add_header Access-Control-Allow-Methods "GET, OPTIONS";
    return 204;
}
