# The JWKS cache. inactive= is what decides how long a key set survives without
# being read, and nginx's default is ten minutes: a node idle overnight would
# otherwise wake with nothing cached, and proxy_cache_use_stale below could not
# keep it serving while the app is down. A month outlives any outage worth
# riding out. (In this image the directory is not a volume, so a recreated
# container starts cold whatever this says.)
proxy_cache_path /data/nginx/cache levels=1 keys_zone=keys:10m inactive=30d;

# A storage node, and nothing else: the app runs elsewhere. Both locations below
# check their tokens against the app's JWKS (/service_public_key), so the node
# holds no secret of its own -- only its TLS certificate.
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl ipv6only=on default_server;
  http2 on;

  # A node must be served under the app's host (the app here being
  # application.localhost): the browser's `datasession` cookie is set by the app
  # with Domain=<app host>, and a node outside that domain never receives it.
  #
  # The first name is also what every service token for this node names in its
  # host claim (see /service/ below), so it must be exactly the hostname the app
  # knows the node by, lowercase.
  server_name node1.application.localhost;
  ssl_certificate /etc/nginx/keys/server.crt;
  ssl_certificate_key /etc/nginx/keys/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Media uploads are gigabytes, and the base image's nginx.conf caps a body at
  # 1m. Set at server scope, not just in /service/, so the key subrequest to
  # /service_public_key -- which runs in the preaccess phase, before the body is
  # read -- inherits it too: otherwise a large body trips "too large body" during
  # that subrequest and the upload fails with a 401.
  client_max_body_size 50g;

  location / {
    return 404;
  }

  # service location for file manipulations, and for the clients' downloads
  location /service/ {
    auth_jwt "private" token=$http_x_session_token;
    auth_jwt_key_request /service_public_key jwks;

    auth_jwt_require_header alg eq RS256;
    auth_jwt_phase preaccess;

    auth_jwt_require_claim method eq json="$request_method";
    auth_jwt_require_claim uri eq json="$uri";
    # One keyset signs for every node, so without this a token minted for one
    # node would be good on all of them. $server_name is this server's first
    # server_name, taken from the config: $host would come from the request's own
    # Host header, and since this is the default server any Host lands here, so a
    # node1 token sent to this node with `Host: node1...` would pass.
    auth_jwt_require_claim host eq json="$server_name";

    alias /data/files/;

    dav_methods PUT DELETE MKCOL COPY MOVE;
    dav_ext_methods PROPFIND OPTIONS;

    # <C:md5>/<C:sha256> PROPFIND properties, which the app's file validation
    # compares against the digests recorded at upload. Hashing blocks the worker
    # for the whole read, but the cap is 0 (no limit) deliberately: a file above it
    # comes back with no digest at all, which validation reads as a failure, so any
    # cap below the largest file stored would make those files unvalidatable.
    dav_ext_checksums on;
    dav_ext_checksum_max_size 0;
  }

  # data location for viewing the content
  location /data/ {
    # The app's data cookie: one for every node, signed with the same keyset as
    # the service tokens.
    auth_jwt "private" token=$cookie_datasession;
    auth_jwt_key_request /service_public_key jwks;

    auth_jwt_require_header alg eq RS256;
    # Service tokens are signed with the same keys, so without this an upload or
    # download link handed to a client would also be a read pass to every node.
    auth_jwt_require_claim scope eq json="data";
    auth_jwt_phase preaccess;

    alias /data/files/;

    include /etc/nginx/options.conf;

    limit_except GET HEAD OPTIONS {
      deny all;
    }
  }

  location = /service_public_key {
    internal;

    # Every /service/ request and every /data/ read asks for the keys here, so
    # this cache is what stands between a page of thumbnails and a JWKS fetch per
    # image. One key set per node, hence a constant key. The app answers with
    # Cache-Control: max-age, which wins over proxy_cache_valid -- the app decides
    # how stale a node's keys may be, and waits that long before signing with a new
    # one; proxy_cache_valid is the fallback for an app that sends none. The
    # lock collapses a cold-cache burst into one fetch -- its timeout is above the
    # worst cold fetch (resolver 5s + connect 2s + read 5s), or each waiting
    # request would go upstream on its own; `updating` and the error statuses keep
    # the last good key set -- and /data/ serving -- when the app is down or slow,
    # and the short timeouts bound how long a token check can hang before it does.
    proxy_cache keys;
    proxy_cache_key "jwks";
    proxy_cache_valid 200 10m;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 15s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;

    # A subrequest carries the client's request along: its Accept-Encoding (the
    # app's front gzips JSON, and auth_jwt refuses a compressed key response, so a
    # key set grown past the gzip threshold would 401 every request), its cookies
    # and X-Session-Token, and an upload's body. None of it is the app's business,
    # so nothing is passed but the headers set here.
    proxy_pass_request_headers off;
    proxy_pass_request_body    off;
    proxy_set_header Content-Length "";

    # The app's host. A variable makes nginx resolve it when the keys are fetched
    # rather than once at startup, where a name that does not resolve yet is
    # fatal and one that does is pinned until a reload. 127.0.0.11 is Docker's
    # embedded DNS, present on user-defined networks only (see the README's
    # `docker run`); elsewhere, name a resolver that can find the app.
    resolver         127.0.0.11 valid=300s ipv6=off;
    resolver_timeout 5s;

    set $pubkey_host application.localhost;
    proxy_pass https://$pubkey_host/.well-known/jwks.json;
    proxy_set_header Host $pubkey_host;

    # The key set decides every token and every data cookie on this node, so
    # whoever serves it must prove to be the app. For an app on a self-signed
    # certificate (a dev setup), mount that certificate and name it here instead
    # of the system bundle.
    proxy_ssl_server_name         on;
    proxy_ssl_name                $pubkey_host;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  }
}
