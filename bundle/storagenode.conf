# Storage node server blocks. Mirrors config/default.conf from the repository,
# with container paths replaced by bundle-relative ones:
#
#   keys/       TLS certificate, node signing key and the JWKS files
#   data/files/ the files served over WebDAV
#   data/cache/ proxy cache for the application public key
#
# See gen_keys_example.sh in the repository for generating the keys/ content.

# Unprivileged ports by default: no root needed, and nothing collides with a
# web UI already occupying 80/443 (NAS and router firmware usually does). Switch
# to 80/443 if the box is free and you can grant CAP_NET_BIND_SERVICE.
#
# Drop the listen [::] lines on kernels built without IPv6 - nginx aborts with
# "Address family not supported by protocol" rather than skipping them.

proxy_cache_path data/cache levels=1 keys_zone=keys:10m;

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;

  # shoud be rendered by app in real word
  location = /public_key {
    root keys;
    default_type application/json;
    try_files /application.jwks =404;
  }

  location / {
    return 404;
  }
}

server {
  listen 8443 ssl default_server;
  listen [::]:8443 ssl ipv6only=on default_server;
  http2 on;

  server_name node1.localhost application.localhost;
  ssl_certificate     keys/server.crt;
  ssl_certificate_key keys/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # demo app
  location / {
    proxy_pass http://127.0.0.1:8080;
  }

  # service location for file manipulations and start frontend sessions
  location /service/ {
    auth_jwt "private" token=$http_x_session_token;
    auth_jwt_key_request /service_public_key jwks;

    auth_jwt_require_header alg eq RS256;
    auth_jwt_phase preaccess;

    auth_jwt_require_claim method eq json="$request_method";
    auth_jwt_require_claim uri eq json="$uri";

    alias data/files/;

    dav_methods PUT DELETE MKCOL COPY MOVE;
    dav_ext_methods PROPFIND OPTIONS;

    # <C:md5>/<C:sha256> PROPFIND properties, computed on every request.
    # Hashing blocks the worker for the whole read, and Depth: 1 hashes every
    # file in the collection, so keep an upper bound on a single file.
    dav_ext_checksums on;
    dav_ext_checksum_max_size 512m;

    location /service/start {
      include options.conf;

      storage_node_session_start 86400 keys/node.pem;
    }
  }

  # data location for viewing the content
  location /data/ {
    auth_jwt "private" token=$cookie_storagesession;
    auth_jwt_key_file keys/node.jwks;

    auth_jwt_require_header alg eq RS256;
    auth_jwt_phase preaccess;

    alias data/files/;

    include options.conf;

    limit_except GET HEAD OPTIONS {
      deny all;
    }
  }

  location = /service_public_key {
    internal;
    proxy_cache keys;
    proxy_pass http://127.0.0.1:8080/public_key;
  }
}
