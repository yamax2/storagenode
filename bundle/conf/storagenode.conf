# The JWKS cache. inactive= is what decides how long a key set survives without
# being read, and nginx's default is ten minutes: a node idle overnight would
# otherwise wake with nothing cached, and proxy_cache_use_stale below could not
# keep it serving while the app is down. A month outlives any outage worth
# riding out.
proxy_cache_path data/cache levels=1 keys_zone=keys:10m inactive=30d;

# nginx's own mime.types has no gpx entry, so a track would be served as the default
# application/octet-stream -- and an octet-stream is a type gzip_types below cannot
# name without also naming everything else unrecognised. Declared here at http level
# (this file is included from the http block), where a second types block *adds* to
# the map from mime.types; inside `location /data/` it would *replace* it, and the
# video served from that same location would lose its video/mp4.
types {
  application/gpx+xml gpx;
}

server {
  listen 8443 ssl default_server;
  http2 on;

  # A node must be served under the app's host (the app here being
  # photos2.tretyakov-ma.ru): the browser's `datasession` cookie is set by the
  # app with Domain=<app host>, and a node outside that domain never receives it.
  #
  # The first name is also what every service token for this node names in its
  # host claim (see /service/ below), so it must be exactly the hostname the app
  # knows the node by, lowercase.
  server_name node1.photos2.tretyakov-ma.ru;
  ssl_certificate     .lego/certificates/node1.photos2.tretyakov-ma.ru.crt;
  ssl_certificate_key .lego/certificates/node1.photos2.tretyakov-ma.ru.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # client_body_temp_path data/cache 1 2;

  # service location for file manipulations, and for the clients' downloads
  location /service/ {
    auth_jwt "private" token=$http_x_session_token;
    auth_jwt_key_request /service_public_key jwks;

    auth_jwt_require_header alg eq RS256;
    auth_jwt_phase preaccess;

    auth_jwt_require_claim method eq json="$request_method";
    auth_jwt_require_claim uri eq json="$uri";
    # One keyset signs for every node, so without this a token minted for one
    # node would be good on all of them. $server_name is this server's first
    # server_name, taken from the config: $host would come from the request's own
    # Host header, and since this is the default server any Host lands here, so a
    # token for another node sent with that node's name in Host would pass.
    auth_jwt_require_claim host eq json="$server_name";

    alias data/files/;

    dav_methods PUT DELETE MKCOL COPY MOVE;
    dav_ext_methods PROPFIND OPTIONS;

    dav_ext_checksums on;
    dav_ext_checksum_max_size 0;
  }

  # data location for viewing the content
  location /data/ {
    # The app's data cookie: one for every node, signed with the same keyset as
    # the service tokens.
    auth_jwt "private" token=$cookie_datasession;
    auth_jwt_key_request /service_public_key jwks;

    auth_jwt_require_header alg eq RS256;
    # Service tokens are signed with the same keys, so without this an upload or
    # download link handed to a client would also be a read pass to every node.
    auth_jwt_require_claim scope eq json="data";
    auth_jwt_phase preaccess;

    alias data/files/;

    include options.conf;

    # A real gpx is 1.4-3.6 MB of xml and compresses ~10x at nginx's default
    # comp_level, which is what a map fetching twenty of them pays for.
    # Deliberately scoped to that one type: a gzipped response carries neither
    # Content-Length nor Accept-Ranges, so widening this to the video would take
    # seeking away from the player.
    gzip on;
    gzip_types application/gpx+xml;
    gzip_min_length 256;

    # Content here is immutable: a /data/ path names one file uuid, and a file's bytes
    # are content-addressed, so one url never serves different bytes. `private`: these
    # reads are gated by the datasession cookie, and a shared cache must not answer
    # for one it never saw. No `always`: auth_jwt's 401 is outside add_header's default
    # status list, and caching *that* for a year would outlive the missing cookie it
    # complains about.
    add_header Cache-Control "private, max-age=31536000, immutable";

    limit_except GET HEAD OPTIONS {
      deny all;
    }
  }

  location = /service_public_key {
    internal;

    # Every /service/ request and every /data/ read asks for the keys here, so
    # these settings no longer matter for uploads alone: they are what stands
    # between a page of thumbnails and a JWKS fetch per image. One key set per
    # node, hence a constant key. The app answers with Cache-Control: max-age and
    # stale-while-revalidate, which between them say how stale a node's keys may
    # be -- the app decides that, and waits that long before signing with a new
    # key. max-age wins over proxy_cache_valid, the fallback for an app that sends
    # none. stale-while-revalidate is what answers the requests arriving beside a
    # refresh from the copy that has just expired, so an expiry in the middle of a
    # page of thumbnails is still one fetch; past that window each of them fetches
    # for itself.
    #
    # Do not add `updating` to proxy_cache_use_stale to save those fetches. It does
    # the same with no bound at all: beside the first read after a quiet night it
    # answers from a copy days old, from before the key the browser's cookie is
    # signed with, and every image but the first is a 401.
    #
    # The lock collapses a cold-cache burst into one fetch (a cold cache only, not
    # an expired entry) -- its timeout is above the worst cold fetch (resolver 5s +
    # connect 2s + read 5s), or each waiting request would go upstream on its own.
    # The errors listed keep the last good key set -- and /data/ serving -- when
    # the app is down, and the short timeouts bound how long a token check can
    # hang before it falls back to it.
    proxy_cache keys;
    proxy_cache_key "jwks";
    proxy_cache_valid 200 10m;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 15s;
    proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;

    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;

    # A subrequest carries the client's request along: its Accept-Encoding (the
    # app's front gzips JSON, and auth_jwt refuses a compressed key response, so a
    # key set grown past the gzip threshold would 401 every request), its cookies
    # and X-Session-Token, and an upload's body. None of it is the app's business,
    # so nothing is passed but the headers set here.
    proxy_pass_request_headers off;
    proxy_pass_request_body    off;
    proxy_set_header Content-Length "";

    resolver         192.168.3.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    set $pubkey_host photos2.tretyakov-ma.ru;
    proxy_pass https://$pubkey_host/.well-known/jwks.json;
    proxy_set_header Host $pubkey_host;

    # The key set decides every token and every data cookie on this node, so
    # whoever serves it must prove to be the app. ca-certificates.crt is the CA
    # bundle the release ships in conf/; replace it to trust a private CA.
    proxy_ssl_server_name         on;
    proxy_ssl_name                $pubkey_host;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        3;
    proxy_ssl_trusted_certificate ca-certificates.crt;
  }
}
