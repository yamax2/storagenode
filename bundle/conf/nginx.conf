# Example main configuration for the self-contained storagenode bundle.
#
# This file lives in conf/, which makes nginx use two different base directories
# and is the one thing to keep in mind when editing:
#
#   prefix       the bundle directory, passed by run.sh as -p. Used for
#                load_module, root, alias, proxy_cache_path, the logs and the
#                temp paths below.
#   conf prefix  the directory holding this file, i.e. conf/, derived by nginx
#                from -c. Used for include, ssl_certificate(_key) and
#                auth_jwt_key_file.
#
# So `logs/error.log` here means <bundle>/logs/error.log, while `mime.types`
# means <bundle>/conf/mime.types. The keys live in conf/keys/, which is why
# storagenode.conf reaches them as `keys/...` from the second group and as
# `conf/keys` from the first. Keep the whole tree relocatable: do not introduce
# absolute paths unless you really mean a system location.

# Resolved against the prefix, so these stay at the bundle root, not in conf/.
load_module ngx_http_auth_jwt_module.so;
load_module ngx_http_dav_ext_module.so;
load_module ngx_http_storage_node_session_start_module.so;

# Worker credentials. Only meaningful when the master starts as root, and the
# names differ between systems (Debian has nobody:nogroup, Alpine nobody:nobody,
# appliance firmware often neither), so it is left to you. With the unprivileged
# ports below nginx runs fine as an ordinary user and this stays off.
#user nobody nogroup;

worker_processes auto;
pid nginx.pid;

# Logs land inside the bundle. Point them at /dev/stderr and /dev/stdout when
# something supervises the process and collects its output -- but only if that
# process owns the streams, otherwise an unprivileged nginx cannot open them.
error_log logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log logs/access.log main;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;

    client_body_temp_path tmp/client_body;
    proxy_temp_path       tmp/proxy;
    fastcgi_temp_path     tmp/fastcgi;
    uwsgi_temp_path       tmp/uwsgi;
    scgi_temp_path        tmp/scgi;

    client_max_body_size 0;

    include storagenode.conf;
}
