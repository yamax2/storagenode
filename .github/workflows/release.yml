name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

env:
  IMAGE_NAME: yamax2/storagenode

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub credentials
        env:
          SECRET_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SECRET_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VAR_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          VAR_TOKEN: ${{ vars.DOCKERHUB_TOKEN }}
        run: |
          echo "secrets.DOCKERHUB_USERNAME: ${SECRET_USERNAME:+set (${#SECRET_USERNAME} chars)}${SECRET_USERNAME:-EMPTY}"
          echo "secrets.DOCKERHUB_TOKEN:    ${SECRET_TOKEN:+set (${#SECRET_TOKEN} chars)}${SECRET_TOKEN:-EMPTY}"
          echo "vars.DOCKERHUB_USERNAME:    ${VAR_USERNAME:+set}${VAR_USERNAME:-EMPTY}"
          echo "vars.DOCKERHUB_TOKEN:       ${VAR_TOKEN:+set}${VAR_TOKEN:-EMPTY}"
          if [ -z "$SECRET_USERNAME" ] || [ -z "$SECRET_TOKEN" ]; then
            echo "::error::Docker Hub credentials are not visible to this job. If the 'vars.' lines above say 'set', they were created as repository *variables* instead of *secrets*."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push multi-arch manifest
    runs-on: ubuntu-24.04
    needs: [build]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE_NAME@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME:${{ steps.meta.outputs.version }}"
