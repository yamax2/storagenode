name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

env:
  IMAGE_NAME: yamax2/storagenode

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub credentials
        env:
          SECRET_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SECRET_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VAR_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          VAR_TOKEN: ${{ vars.DOCKERHUB_TOKEN }}
        run: |
          echo "secrets.DOCKERHUB_USERNAME: ${SECRET_USERNAME:+set (${#SECRET_USERNAME} chars)}${SECRET_USERNAME:-EMPTY}"
          echo "secrets.DOCKERHUB_TOKEN:    ${SECRET_TOKEN:+set (${#SECRET_TOKEN} chars)}${SECRET_TOKEN:-EMPTY}"
          echo "vars.DOCKERHUB_USERNAME:    ${VAR_USERNAME:+set}${VAR_USERNAME:-EMPTY}"
          echo "vars.DOCKERHUB_TOKEN:       ${VAR_TOKEN:+set}${VAR_TOKEN:-EMPTY}"
          if [ -z "$SECRET_USERNAME" ] || [ -z "$SECRET_TOKEN" ]; then
            echo "::error::Docker Hub credentials are not visible to this job. If the 'vars.' lines above say 'set', they were created as repository *variables* instead of *secrets*."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push multi-arch manifest
    runs-on: ubuntu-24.04
    needs: [build]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE_NAME@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME:${{ steps.meta.outputs.version }}"

  bundle:
    name: Build ${{ matrix.name }} archive
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm/v7
            name: linux-armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          ref='${{ github.ref }}'
          case "$ref" in
            refs/tags/*) version="${ref#refs/tags/}" ;;
            *)           version="0.0.0-${GITHUB_SHA::7}" ;;
          esac
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The bundle is cross-built under emulation, so a cold cache takes a
      # while; the warm one keeps re-runs of a release cheap.
      - name: Build bundle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./bundle/Dockerfile
          target: bundle
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=bundle-${{ matrix.name }}
          cache-to: type=gha,scope=bundle-${{ matrix.name }},mode=max
          outputs: type=local,dest=./bundle-out
          provenance: false

      - name: Create archive
        id: archive
        env:
          DIR: storagenode-${{ steps.version.outputs.version }}-${{ matrix.name }}
        run: |
          mv ./bundle-out "$DIR"
          chmod +x "$DIR/run.sh" "$DIR/nginx"
          # buildx exports the destination directory as 0700. Left that way the
          # archive unpacks into a directory the nginx worker user cannot
          # traverse, and every static file 404s with a [crit] "Permission
          # denied" naming the file rather than the directory. conf/ needs the
          # same treatment: the worker reads mime.types from it at startup.
          find "$DIR" -type d -exec chmod 755 {} +
          tar -czf "$DIR.tar.gz" "$DIR"
          sha256sum "$DIR.tar.gz" > "$DIR.tar.gz.sha256"
          echo "name=$DIR" >> "$GITHUB_OUTPUT"
          ls -laR "$DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.tar.gz
            ${{ steps.archive.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.archive.outputs.name }}.tar.gz
            ${{ steps.archive.outputs.name }}.tar.gz.sha256
